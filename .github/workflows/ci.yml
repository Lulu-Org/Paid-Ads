# Checks every pull request and every push to main (AGENTS.md "Done for a task": tests pass).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @lulu/api
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lulu
          POSTGRES_PASSWORD: lulu_ci_password
          POSTGRES_DB: lulu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lulu -d lulu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Throwaway values for the CI containers only; no real secret is needed here.
    env:
      DATABASE_URL: postgresql://lulu:lulu_ci_password@localhost:5432/lulu
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @lulu/api
      - run: npm run db:deploy -w @lulu/api
      - run: npm run test:int
