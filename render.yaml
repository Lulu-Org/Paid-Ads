# Render Blueprint for the API (render.com → New → Blueprint, pick this repo).
# The web app is on Vercel and forwards /api/v1 here (API_PROXY_TARGET, apps/web/next.config.ts).
# Values marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: lulu-paid-ads-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Neon connection string (postgresql://...)
      - key: DATABASE_URL
        sync: false
      # Upstash URL (rediss://...)
      - key: REDIS_URL
        sync: false
      # The Vercel link of the web app
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # AES-256-GCM key for ad-account tokens (required in production).
      - key: ADS_TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Public API URL used for the OAuth callback (the Render link).
      - key: API_PUBLIC_URL
        sync: false
      # Google Ads API credentials for live Google LSA (required when the provider is live).
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v26
      # Provider per platform: simulated | live. Google LSA is live-capable (C1); live fails for
      # the other platforms until their connector exists (C2-C4).
      - key: ADS_PROVIDER_GOOGLE_LSA
        value: simulated
      - key: ADS_PROVIDER_GOOGLE_ADS
        value: simulated
      - key: ADS_PROVIDER_META_ADS
        value: simulated
      - key: ADS_PROVIDER_LINKEDIN_ADS
        value: simulated
      # LinkedIn app (C4). Set these, then switch ADS_PROVIDER_LINKEDIN_ADS to live.
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        sync: false
      # "true" loads the design's sample data on every start (the entrypoint runs the seed).
      # Keep it "false" once real ad accounts are connected, so samples never mix with real data.
      - key: SEED_ON_START
        value: "false"
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_MEMBER_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: simulated
